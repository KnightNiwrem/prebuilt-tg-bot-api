name: Refresh public lockfile
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Reviewed full commit SHA; abort if main has moved
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: refresh-lockfile
  cancel-in-progress: false
jobs:
  refresh:
    if: ${{ github.ref == 'refs/heads/main' && github.sha == inputs.expected_sha }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2
        with:
          deno-version: v2.9.6
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm install --global npm@11.19.0
      - run: deno task versions
      - name: Resolve public native dependencies only in CI
        run: deno check packages/launcher/cli.ts packages/launcher/mod.ts
      - name: Export the small lockfile and review diff
        run: |
          mkdir -p dist/public-lockfile
          cp deno.lock dist/public-lockfile/deno.lock
          git diff -- deno.lock > dist/public-lockfile/deno.lock.diff
          git rev-parse HEAD > dist/public-lockfile/commit.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: public-lockfile-${{ github.run_attempt }}
          path: dist/public-lockfile/
          retention-days: 30
          if-no-files-found: error
